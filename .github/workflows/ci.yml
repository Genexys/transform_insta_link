name: CI

on:
  push:
    branches:
      - master
      - main
      - 'codex/**'
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The compiled .js files are committed and are what production runs.
      # Fail if a .ts change was committed without its rebuilt .js.
      - name: Check committed build artifacts are up to date
        run: git diff --exit-code -- '*.js'

      - name: Test
        run: npm test
