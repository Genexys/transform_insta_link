# Home YouTube worker (youtube_worker.ts): downloads YouTube Shorts for the bot
# from a residential IP. It only makes outbound HTTPS requests to the bot and
# publishes no ports. Setup and updates: docs/youtube-home-worker.md
#
#   docker compose -f compose.worker.yaml up -d --build
name: transform-insta-link-worker

services:
  youtube-worker:
    # The bot's own image: same yt-dlp, yt-dlp-ejs, ffmpeg and Node.
    build: .
    image: transform-insta-link-youtube-worker
    command: ['node', 'youtube_worker.js']
    restart: unless-stopped
    init: true
    # YT_WORKER_BOT_URL and YT_WORKER_TOKEN; .env.* files are gitignored.
    env_file: .env.worker
    environment:
      # yt-dlp caches YouTube player data; the root filesystem is read-only.
      XDG_CACHE_HOME: /tmp/cache
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging:
      driver: local
      options:
        max-size: 10m
